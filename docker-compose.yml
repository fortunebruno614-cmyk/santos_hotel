services:
  postgres:
    image: postgres:16-alpine
    container_name: santos-hotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: santos
      POSTGRES_PASSWORD: santos
      POSTGRES_DB: santos_hotel
    ports:
      - "5432:5432"
    volumes:
      - santos_hotel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santos -d santos_hotel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  santos_hotel_pgdata:
